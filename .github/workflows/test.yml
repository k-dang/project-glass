name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every job starts at once and first checks whether the event can affect the apps it tests. A job
  # a pull request cannot affect skips its remaining steps and reports success. A path the check
  # does not know runs every job, and so does every push to main, which checks what landed after
  # other pull requests merged.
  server:
    name: test (server ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: check
        uses: ./.github/actions/affected
        with:
          apps: server
      - if: steps.check.outputs.affected == 'true'
        uses: ./.github/actions/setup
      - if: steps.check.outputs.affected == 'true'
        run: pnpm --filter @glass/server test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  desktop:
    name: test (desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: check
        uses: ./.github/actions/affected
        with:
          apps: desktop
      - if: steps.check.outputs.affected == 'true'
        uses: ./.github/actions/setup
      - if: steps.check.outputs.affected == 'true'
        run: pnpm --filter @glass/desktop test

  # The end-to-end tests drive the desktop app against the server, so a change to either runs them.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: check
        uses: ./.github/actions/affected
        with:
          apps: server desktop
      - if: steps.check.outputs.affected == 'true'
        uses: ./.github/actions/setup
      - name: Let Chromium's sandbox create the user namespaces Ubuntu's AppArmor blocks
        if: steps.check.outputs.affected == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: steps.check.outputs.affected == 'true'
        run: xvfb-run -a pnpm test:e2e --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/desktop/playwright-report
