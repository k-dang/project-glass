name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install
      - run: pnpm check

  test:
    strategy:
      fail-fast: false
      matrix:
        app: [server, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install
      - run: pnpm --filter @glass/${{ matrix.app }} test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install
      - name: Let Chromium's sandbox create the user namespaces Ubuntu's AppArmor blocks
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm build
      - run: xvfb-run -a pnpm --filter @glass/desktop exec playwright test e2e/agent.spec.ts e2e/ask.spec.ts --repeat-each=25 --reporter=line --timeout=40000 2>&1 | grep -E --line-buffered 'DIAG|✘|passed|failed|flaky|Error|Timeout' ; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/desktop/playwright-report
