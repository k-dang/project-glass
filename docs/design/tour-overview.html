<!doctype html>
<html lang="en" data-example="opencode">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glass · Tour overview studies</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: light-dark(#fff, #111);
        --foreground: light-dark(#292929, #dedede);
        --card: light-dark(#fafafa, #171717);
        --muted: light-dark(#eee, #242424);
        --muted-foreground: light-dark(#656565, #a3a3a3);
        --border: light-dark(#ddd, #303030);
        --accent: light-dark(#e8e8e8, #292929);
        --ring: light-dark(#6255c4, #a6a8ff);
        --success: light-dark(#247c3c, #63cd7b);
        --destructive: light-dark(#bd3338, #ef8586);
        --radius: 10px;
        --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: ui-monospace, "Cascadia Code", Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        color: var(--foreground);
        font: 13px/1.6 var(--font-sans);
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      summary:focus-visible,
      [tabindex="-1"]:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 4px;
      }
      button:active {
        transform: scale(0.985);
      }
      button:hover {
        background-color: var(--accent);
      }
      button:disabled {
        cursor: default;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 16px;
        line-height: 1.4;
        font-weight: 600;
      }
      h2 {
        font-size: 15px;
        line-height: 1.5;
        font-weight: 600;
      }
      h3 {
        font-size: 12px;
        font-weight: 600;
      }
      .prototype-tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }
      .prototype-label {
        color: var(--muted-foreground);
        font-size: 11px;
      }
      .examples {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        padding: 3px;
        background: var(--muted);
        border-radius: 8px;
      }
      .example {
        border: 1px solid transparent;
        border-radius: 5px;
        padding: 5px 12px;
        font-size: 12px;
        background: transparent;
      }
      .example[aria-pressed="true"] {
        background: var(--card);
        border-color: var(--border);
      }
      .pr-title {
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 12px;
      }
      .overview {
        display: grid;
        grid-template-columns: 290px minmax(0, 1fr);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        overflow: clip;
      }
      .intro {
        padding: 23px;
        border-right: 1px solid var(--border);
      }
      .eyebrow {
        font: 10px/1.5 var(--font-mono);
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }
      .counts {
        margin-top: 9px;
      }
      .intent {
        color: var(--muted-foreground);
        line-height: 1.85;
        margin-top: 21px;
      }
      .start {
        margin-top: 19px;
        background: var(--foreground);
        color: var(--background);
        border: 0;
        border-radius: 6px;
        padding: 5px 11px;
        font-size: 12px;
        font-weight: 500;
      }
      .start:hover {
        background: color-mix(in srgb, var(--foreground) 85%, var(--background));
      }
      .start span {
        padding-right: 5px;
      }
      .chapter-nav {
        margin-top: 28px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
      }
      .chapter-nav ol {
        padding: 0;
        margin: 9px 0 0;
        list-style: none;
      }
      .chapter-link {
        display: flex;
        align-items: baseline;
        gap: 10px;
        width: 100%;
        background: transparent;
        border: 0;
        border-top: 1px solid var(--border);
        padding: 10px 0;
        text-align: left;
        font-size: 12px;
      }
      .chapter-link .number {
        color: var(--muted-foreground);
        font: 10px var(--font-mono);
      }
      .chapter-link .arrow {
        margin-left: auto;
        color: var(--muted-foreground);
      }
      .chapter-link[aria-current="step"] .number {
        color: var(--ring);
      }
      .chapter-link[aria-current="step"] {
        font-weight: 600;
      }
      .map {
        min-width: 0;
        padding: 20px;
      }
      .map-heading {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid var(--border);
      }
      .map-heading > div {
        flex: 1;
        min-width: 180px;
      }
      .map-title {
        margin-top: 3px;
        font-size: 13px;
        font-weight: 500;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 13px;
        color: var(--muted-foreground);
        font-size: 10px;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .legend i {
        display: inline-block;
        width: 14px;
        height: 0;
        border-top: 1.5px solid var(--muted-foreground);
      }
      .legend .new {
        border-color: var(--success);
      }
      .legend .old {
        border-color: var(--destructive);
        border-top-style: dashed;
      }
      .stage-scroll {
        overflow-x: auto;
        scrollbar-width: thin;
        padding: 9px 5px 4px;
        margin: 0 -5px;
      }
      .stage {
        width: 540px;
        position: relative;
        margin: 0 auto;
      }
      .connections {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .edge {
        fill: none;
        stroke: var(--muted-foreground);
        stroke-width: 1.5;
        stroke-linejoin: round;
      }
      .edge.added {
        stroke: var(--success);
      }
      .edge.removed {
        stroke: var(--destructive);
        stroke-dasharray: 5 4;
      }
      .edge-label {
        font: 10px var(--font-sans);
        fill: var(--muted-foreground);
        text-anchor: middle;
        paint-order: stroke;
        stroke: var(--card);
        stroke-width: 6;
        stroke-linejoin: round;
      }
      .edge-label.added {
        fill: var(--success);
      }
      .edge-label.removed {
        fill: var(--destructive);
      }
      .node {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        text-align: left;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--background);
        padding: 10px 12px;
      }
      .node.added {
        border-color: color-mix(in srgb, var(--success) 52%, var(--border));
        background: color-mix(in srgb, var(--success) 5%, var(--background));
      }
      .node[aria-pressed="true"] {
        outline: 2px solid var(--ring);
        outline-offset: 3px;
      }
      .node-top {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: space-between;
        font-size: 10px;
        line-height: 1.3;
        color: var(--muted-foreground);
        margin-bottom: 5px;
      }
      .node.added .node-top {
        color: var(--success);
      }
      .badge {
        font: 9px/1.2 var(--font-mono);
        color: var(--muted-foreground);
      }
      .node strong {
        font-size: 12px;
        line-height: 1.4;
        font-weight: 500;
      }
      .map-caption {
        color: var(--muted-foreground);
        font-size: 11px;
        border-top: 1px solid var(--border);
        padding-top: 13px;
        margin-top: 8px;
      }
      .scroll-hint {
        display: none;
        margin-top: 10px;
        font-size: 10px;
        color: var(--muted-foreground);
      }
      .outline {
        margin: 23px 0;
        padding: 0;
        list-style: none;
        font: 12px/1.6 var(--font-mono);
      }
      .outline button {
        width: 100%;
        display: flex;
        gap: 12px;
        text-align: left;
        background: transparent;
        border: 0;
        border-left: 2px solid transparent;
        padding: 10px 11px;
      }
      .outline .added button {
        border-left-color: var(--success);
        background: color-mix(in srgb, var(--success) 7%, transparent);
      }
      .outline .removed button {
        border-left-color: var(--destructive);
        background: color-mix(in srgb, var(--destructive) 7%, transparent);
      }
      .outline button:hover {
        background: var(--accent);
      }
      .outline .sign {
        width: 12px;
        flex-shrink: 0;
        color: var(--muted-foreground);
      }
      .outline .added .sign {
        color: var(--success);
      }
      .outline .removed .sign {
        color: var(--destructive);
      }
      .outline .line-text {
        flex: 1;
        overflow-wrap: anywhere;
      }
      .outline .line-chapter {
        font-size: 9px;
        align-self: center;
        color: var(--muted-foreground);
        white-space: nowrap;
      }
      .outline button[aria-pressed="true"] {
        outline: 2px solid var(--ring);
        outline-offset: -2px;
      }
      .reader {
        margin-top: 18px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        overflow: clip;
      }
      .reader-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 13px 18px;
        border-bottom: 1px solid var(--border);
      }
      .back {
        font-size: 11px;
        background: transparent;
        color: var(--muted-foreground);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 4px 8px;
        white-space: nowrap;
      }
      .reader-body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr);
      }
      .chapter-explanation {
        padding: 18px;
      }
      .chapter-explanation h2 {
        margin: 7px 0 10px;
      }
      .chapter-explanation p {
        color: var(--muted-foreground);
        font-size: 12px;
        line-height: 1.8;
      }
      .source {
        padding: 18px;
        border-left: 1px solid var(--border);
        min-width: 0;
      }
      .filename {
        display: block;
        margin-top: 6px;
        font: 11px var(--font-mono);
        overflow-wrap: anywhere;
      }
      .source-lines {
        margin: 15px 0 0;
        padding: 0;
        list-style: none;
        font: 11px/1.8 var(--font-mono);
      }
      .source-lines li {
        padding: 4px 9px;
        overflow-wrap: anywhere;
        border-left: 2px solid transparent;
      }
      .source-lines .selected-line {
        border-left-color: var(--ring);
        background: color-mix(in srgb, var(--ring) 10%, transparent);
      }
      .provenance {
        font-size: 10px;
        line-height: 1.7;
        color: var(--muted-foreground);
        margin-top: 13px;
        max-width: 95ch;
      }
      @media (max-width: 1000px) {
        .overview {
          grid-template-columns: 1fr;
        }
        .intro {
          border-right: 0;
          border-bottom: 1px solid var(--border);
          display: grid;
          grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
          gap: 26px;
          padding: 20px;
        }
        .intent {
          margin-top: 15px;
        }
        .chapter-nav {
          margin-top: 0;
          padding-top: 0;
          border-top: 0;
        }
        .map {
          padding: 20px;
        }
      }
      @media (max-width: 620px) {
        .intro {
          grid-template-columns: 1fr;
          gap: 20px;
          padding: 16px;
        }
        .chapter-nav {
          border-top: 1px solid var(--border);
          padding-top: 14px;
        }
        .chapter-nav ol {
          margin-bottom: -5px;
        }
        .chapter-link {
          padding: 8px 0;
        }
        .map {
          padding: 16px;
        }
        .scroll-hint {
          display: block;
        }
        .reader-body {
          grid-template-columns: 1fr;
        }
        .source {
          border-left: 0;
          border-top: 1px solid var(--border);
        }
        .example {
          padding-inline: 9px;
        }
        .line-chapter {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="prototype-tools">
      <div class="examples" role="group" aria-label="Hand-authored examples">
        <button class="example" data-example="opencode" aria-pressed="true">
          Branching · OpenCode
        </button>
        <button class="example" data-example="linear" aria-pressed="false">
          Linear · Validation
        </button>
        <button class="example" data-example="outline" aria-pressed="false">
          Outline · Settings
        </button>
      </div>
      <span class="prototype-label">Hand-authored design studies</span>
    </div>
    <main>
      <p class="pr-title" id="pr-title"></p>
      <section class="overview" aria-labelledby="overview-title">
        <aside class="intro">
          <div>
            <h1 id="overview-title" tabindex="-1">Tour overview</h1>
            <p class="eyebrow counts" id="counts"></p>
            <p class="intent" id="intent"></p>
            <button class="start" id="start">
              <span aria-hidden="true">▤</span> Start reading
            </button>
          </div>
          <nav class="chapter-nav" aria-label="Chapters">
            <p class="eyebrow">Reading order</p>
            <ol id="chapter-links"></ol>
          </nav>
        </aside>
        <div class="map">
          <header class="map-heading">
            <div>
              <h2>Before / after</h2>
              <p class="map-title" id="map-title"></p>
            </div>
            <div class="legend" aria-label="Change legend" style="flex: 0 1 auto; min-width: 0">
              <span><i></i>Unchanged</span><span><i class="new"></i>Added</span
              ><span><i class="old"></i>Removed</span>
            </div>
          </header>
          <p class="scroll-hint" id="scroll-hint">Scroll horizontally to follow the map →</p>
          <div id="visual"></div>
          <p class="map-caption" id="map-caption"></p>
        </div>
      </section>
      <section class="reader" aria-labelledby="reader-title">
        <header class="reader-heading">
          <p class="eyebrow" id="reader-context">Chapter 01</p>
          <button class="back" id="back">↑ Tour overview</button>
        </header>
        <div class="reader-body">
          <div class="chapter-explanation">
            <p class="eyebrow" id="selection-context">Start here</p>
            <h2 id="reader-title" tabindex="-1"></h2>
            <p id="chapter-copy"></p>
          </div>
          <div class="source">
            <p class="eyebrow">Illustrative outline · not a source diff</p>
            <span class="filename" id="filename"></span>
            <ol class="source-lines" id="source-lines"></ol>
          </div>
        </div>
      </section>
      <p class="provenance" id="provenance"></p>
    </main>
    <script>
      const examples = {
        opencode: {
          title: "Add native OpenCode support for ordinary Agents",
          counts: "3 preview Chapters · 59 changed files",
          intent:
            "Run ordinary Glass Agents with OpenCode as well as Claude Code or pi. OpenCode runs as an authenticated service, and its native events and history become Glass Agent Turns.",
          mapTitle: "A new program path, the same Glass Turns",
          caption:
            "The two existing paths stay in place. The new OpenCode path translates native events and history into the Turns Glass displays. Select a node to read its Chapter.",
          provenance:
            "OpenCode is a schematic based on your supplied Tour screenshot. These Chapter boundaries and outlines are hand-authored for design review; OpenCode source is not present in this checkout. Tours and Agent reviews continue to use Claude Code or pi.",
          height: 472,
          chapters: [
            {
              title: "Start the selected program",
              file: "HostAgents.ts",
              copy: "The Agent host starts the adapter for the selected program. Claude Code and pi keep their existing paths; OpenCode becomes another choice for ordinary Agents.",
              lines: [
                "start an ordinary Glass Agent",
                "read its selected program",
                "start that program’s adapter",
              ],
              first: "start",
            },
            {
              title: "Run the OpenCode service",
              file: "openCodeRuntime.ts",
              copy: "The OpenCode path runs a local authenticated service. It joins the existing Agent host and session interface rather than changing how the reader follows a conversation in Glass.",
              lines: [
                "start OpenCode as an authenticated service",
                "connect through the existing session interface",
              ],
              first: "opencode",
            },
            {
              title: "Turn native history into Glass Turns",
              file: "openCodeTurn.ts",
              copy: "OpenCode’s native events and history become Glass Agent Turns. This is where the new program path meets the conversation model that Glass already displays.",
              lines: [
                "read OpenCode’s native events and history",
                "translate them into Glass Agent Turns",
                "display the conversation in Glass",
              ],
              first: "translate",
            },
          ],
          nodes: [
            {
              id: "start",
              label: "Start an Agent",
              kind: "Existing entry",
              chapter: 0,
              line: 0,
              x: 180,
              y: 16,
              w: 180,
              h: 68,
            },
            {
              id: "claude",
              label: "Claude Code",
              kind: "Existing program",
              chapter: 0,
              line: 2,
              x: 6,
              y: 160,
              w: 156,
              h: 72,
            },
            {
              id: "pi",
              label: "pi",
              kind: "Existing program",
              chapter: 0,
              line: 2,
              x: 192,
              y: 160,
              w: 156,
              h: 72,
            },
            {
              id: "opencode",
              label: "OpenCode service",
              kind: "+ New program",
              change: "added",
              chapter: 1,
              line: 0,
              x: 378,
              y: 160,
              w: 156,
              h: 72,
            },
            {
              id: "translate",
              label: "Translate events & history",
              kind: "+ New adapter",
              change: "added",
              chapter: 2,
              line: 1,
              x: 378,
              y: 292,
              w: 156,
              h: 76,
            },
            {
              id: "turns",
              label: "Glass Agent Turns",
              kind: "Existing interface",
              chapter: 2,
              line: 2,
              x: 180,
              y: 400,
              w: 180,
              h: 68,
            },
          ],
          edges: [
            {
              from: "start",
              to: "claude",
              path: "M270 84 V120 H84 V157",
              label: "Claude Code",
              lx: 84,
              ly: 141,
            },
            { from: "start", to: "pi", path: "M270 84 V157", label: "pi", lx: 281, ly: 140 },
            {
              from: "start",
              to: "opencode",
              path: "M270 120 H456 V157",
              change: "added",
              label: "+ OpenCode",
              lx: 456,
              ly: 141,
            },
            { from: "claude", to: "turns", path: "M84 232 V434 H177" },
            { from: "pi", to: "turns", path: "M270 232 V397" },
            {
              from: "opencode",
              to: "translate",
              path: "M456 232 V289",
              change: "added",
              label: "native events",
              lx: 456,
              ly: 265,
            },
            { from: "translate", to: "turns", path: "M456 368 V434 H363", change: "added" },
          ],
        },
        linear: {
          title: "Validate submitted fields before saving",
          counts: "2 Chapters · synthetic example",
          intent:
            "Validate submitted fields before they reach storage. Previously, the submitted values went straight to the save function. The new step checks them first and passes valid input on to the same storage code.",
          mapTitle: "Insert a check before the existing save",
          caption:
            "The dashed path used to skip validation. The new path inserts one step; the receiving and saving code keep their places. This map shows the successful path.",
          provenance:
            "Synthetic PR written only to compare the linear layout with the branching and outline examples. File names, Chapters, and code outlines are illustrative.",
          height: 282,
          chapters: [
            {
              title: "Check input before saving",
              file: "submit.ts",
              copy: "The submission handler validates the incoming fields before passing them to storage. The change is in the order of work: validation now sits between receiving the form and saving it.",
              lines: [
                "receive submitted fields",
                "validate the submitted fields",
                "pass valid input to save",
              ],
              first: "validate",
            },
            {
              title: "Keep the existing save path",
              file: "storage.ts",
              copy: "Valid input reaches the existing save function. Storage remains the end of this path; it does not take on the responsibility for validating form submissions.",
              lines: ["receive validated input", "save the record using existing storage"],
              first: "save",
            },
          ],
          nodes: [
            {
              id: "receive",
              label: "Receive fields",
              kind: "Unchanged",
              chapter: 0,
              line: 0,
              x: 6,
              y: 64,
              w: 156,
              h: 78,
            },
            {
              id: "validate",
              label: "Validate input",
              kind: "+ Added step",
              change: "added",
              chapter: 0,
              line: 1,
              x: 192,
              y: 64,
              w: 156,
              h: 78,
            },
            {
              id: "save",
              label: "Save the record",
              kind: "Unchanged",
              chapter: 1,
              line: 1,
              x: 378,
              y: 64,
              w: 156,
              h: 78,
            },
          ],
          edges: [
            { from: "receive", to: "validate", path: "M162 103 H189", change: "added" },
            { from: "validate", to: "save", path: "M348 103 H375", change: "added" },
            {
              from: "receive",
              to: "save",
              path: "M84 142 V224 H456 V145",
              change: "removed",
              label: "before · save without checking",
              lx: 270,
              ly: 246,
            },
          ],
          annotations: [{ text: "AFTER · VALIDATE, THEN SAVE", x: 270, y: 30 }],
        },
        outline: {
          title: "Group rate-limit settings under one key",
          counts: "2 Chapters · synthetic example",
          intent:
            "Give rate limiting its own configuration section. The burst and refill values stay the same; they move under rateLimit, beside a new enabled setting.",
          mapTitle: "Keep the values, change their home",
          caption:
            "Indentation makes this change easier to read than a graph. Removed lines show the old keys; added lines show their new home. Select a line to read its Chapter.",
          provenance:
            "Synthetic configuration change, using the 20-token burst and five-token refill from Glass’s existing demo. The previous flat structure is invented for this study.",
          chapters: [
            {
              title: "Group the limiter’s configuration",
              file: "config/schema.ts",
              copy: "The two existing rate-limit values move into one section. Grouping them makes the ownership visible without changing the burst capacity or refill rate.",
              lines: ["configuration", "  rateLimit", "    burst: 20", "    refillPerSecond: 5"],
              first: "group",
            },
            {
              title: "Set the enabled default",
              file: "config/default.json",
              copy: "The new enabled setting lives beside the burst and refill values. The default turns rate limiting on, with the same 20-token burst and five-token-per-second refill.",
              lines: ["rateLimit", "  enabled: true", "  burst: 20", "  refillPerSecond: 5"],
              first: "enabled",
            },
          ],
          lines: [
            { id: "root", text: "configuration", depth: 0, chapter: 0, line: 0 },
            {
              id: "old-burst",
              text: "burst: 20",
              depth: 1,
              change: "removed",
              chapter: 0,
              line: 2,
            },
            {
              id: "old-refill",
              text: "refillPerSecond: 5",
              depth: 1,
              change: "removed",
              chapter: 0,
              line: 3,
            },
            { id: "group", text: "rateLimit", depth: 1, change: "added", chapter: 0, line: 1 },
            {
              id: "enabled",
              text: "enabled: true",
              depth: 2,
              change: "added",
              chapter: 1,
              line: 1,
            },
            { id: "burst", text: "burst: 20", depth: 2, change: "added", chapter: 1, line: 2 },
            {
              id: "refill",
              text: "refillPerSecond: 5",
              depth: 2,
              change: "added",
              chapter: 1,
              line: 3,
            },
          ],
        },
      }

      const $ = (id) => document.getElementById(id)
      const number = (index) => String(index + 1).padStart(2, "0")
      const escapeHtml = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char],
        )
      let currentExample

      function selectTarget(id, navigate = true) {
        const example = examples[currentExample]
        const target = (example.nodes || example.lines).find((item) => item.id === id)
        const chapter = example.chapters[target.chapter]
        document
          .querySelectorAll("[data-target]")
          .forEach((button) =>
            button.setAttribute("aria-pressed", String(button.dataset.target === id)),
          )
        document.querySelectorAll("[data-chapter]").forEach((button) => {
          if (Number(button.dataset.chapter) === target.chapter)
            button.setAttribute("aria-current", "step")
          else button.removeAttribute("aria-current")
        })
        $("reader-context").textContent =
          `Chapter ${number(target.chapter)} / ${number(example.chapters.length - 1)}`
        $("selection-context").textContent = target.label || target.text
        $("reader-title").textContent = chapter.title
        $("chapter-copy").textContent = chapter.copy
        $("filename").textContent = chapter.file
        $("source-lines").innerHTML = chapter.lines
          .map(
            (line, index) =>
              `<li${index === target.line ? ' class="selected-line"' : ""}>${escapeHtml(line).replace(/^ +/, (spaces) => "&nbsp;".repeat(spaces.length))}</li>`,
          )
          .join("")
        if (navigate) {
          $("reader-title").focus({ preventScroll: true })
          document
            .querySelector(".reader")
            .scrollIntoView({ block: "nearest", behavior: "instant" })
        }
      }

      function renderGraph(example) {
        const marker = (kind, color) =>
          `<marker id="arrow-${kind}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="var(--${color})" stroke-width="1.5"/></marker>`
        const edges = example.edges
          .map((edge) => {
            const change = edge.change || "unchanged"
            return `<path class="edge ${change}" d="${edge.path}" marker-end="url(#arrow-${change})"/>${edge.label ? `<text class="edge-label ${change}" x="${edge.lx}" y="${edge.ly}">${escapeHtml(edge.label)}</text>` : ""}`
          })
          .join("")
        const labels = (example.annotations || [])
          .map(
            (label) =>
              `<text class="edge-label" x="${label.x}" y="${label.y}" style="font-size:9px;letter-spacing:.07em">${escapeHtml(label.text)}</text>`,
          )
          .join("")
        const nodes = example.nodes
          .map(
            (node) =>
              `<button class="node ${node.change || ""}" data-target="${node.id}" aria-pressed="false" aria-label="${escapeHtml(node.label)}, ${node.change || "unchanged"}. Read Chapter ${number(node.chapter)}" style="left:${node.x}px;top:${node.y}px;width:${node.w}px;height:${node.h}px"><span class="node-top"><span>${escapeHtml(node.kind)}</span><span class="badge">${number(node.chapter)} ↗</span></span><strong>${escapeHtml(node.label)}</strong></button>`,
          )
          .join("")
        const descriptions = example.edges
          .map((edge) => {
            const from = example.nodes.find((node) => node.id === edge.from).label
            const to = example.nodes.find((node) => node.id === edge.to).label
            return `${from} → ${to}${edge.label ? ` (${edge.label})` : ""}, ${edge.change || "unchanged"}`
          })
          .join(". ")
        return `<div class="stage-scroll" tabindex="0" role="group" aria-label="Scrollable change map"><div class="stage" style="height:${example.height}px"><svg class="connections" viewBox="0 0 540 ${example.height}" aria-hidden="true"><defs>${marker("unchanged", "muted-foreground")}${marker("added", "success")}${marker("removed", "destructive")}</defs>${edges}${labels}</svg>${nodes}</div></div><details style="font-size:10px;color:var(--muted-foreground);margin-top:6px"><summary>Connections in words</summary><p style="padding-top:6px">${escapeHtml(descriptions)}</p></details>`
      }

      function renderOutline(example) {
        return `<ol class="outline">${example.lines.map((line) => `<li class="${line.change || ""}"><button data-target="${line.id}" aria-pressed="false" aria-label="${escapeHtml(line.text)}, ${line.change || "unchanged"}. Read Chapter ${number(line.chapter)}"><span class="sign" aria-hidden="true">${line.change === "added" ? "+" : line.change === "removed" ? "−" : ""}</span><span class="line-text" style="padding-left:${line.depth * 19}px">${escapeHtml(line.text)}</span><span class="line-chapter">${number(line.chapter)} ↗</span></button></li>`).join("")}</ol>`
      }

      function renderExample(key) {
        currentExample = key
        const example = examples[key]
        document
          .querySelectorAll(".example")
          .forEach((button) =>
            button.setAttribute("aria-pressed", String(button.dataset.example === key)),
          )
        $("pr-title").textContent = example.title
        $("counts").textContent = example.counts
        $("intent").textContent = example.intent
        $("map-title").textContent = example.mapTitle
        $("map-caption").textContent = example.caption
        $("provenance").textContent = example.provenance
        $("scroll-hint").hidden = !example.nodes
        $("chapter-links").innerHTML = example.chapters
          .map(
            (chapter, index) =>
              `<li><button class="chapter-link" data-chapter="${index}"><span class="number">${number(index)}</span><span>${escapeHtml(chapter.title)}</span><span class="arrow" aria-hidden="true">↗</span></button></li>`,
          )
          .join("")
        $("visual").innerHTML = example.nodes ? renderGraph(example) : renderOutline(example)
        $("visual")
          .querySelectorAll("[data-target]")
          .forEach((button) =>
            button.addEventListener("click", () => selectTarget(button.dataset.target)),
          )
        $("chapter-links")
          .querySelectorAll("[data-chapter]")
          .forEach((button) =>
            button.addEventListener("click", () =>
              selectTarget(example.chapters[Number(button.dataset.chapter)].first),
            ),
          )
        selectTarget(example.chapters[0].first, false)
      }

      document
        .querySelectorAll(".example")
        .forEach((button) =>
          button.addEventListener("click", () => renderExample(button.dataset.example)),
        )
      $("start").addEventListener("click", () =>
        selectTarget(examples[currentExample].chapters[0].first),
      )
      $("back").addEventListener("click", () => {
        $("overview-title").focus({ preventScroll: true })
        document.querySelector(".overview").scrollIntoView({ block: "start", behavior: "instant" })
      })
      renderExample(document.documentElement.dataset.example || "opencode")
    </script>
  </body>
</html>
