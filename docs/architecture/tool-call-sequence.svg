<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" width="1000" height="790"><rect width="1000" height="790" fill="#ffffff"></rect><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"></path></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"></feDropShadow></filter></defs><line x1="120" y1="84" x2="120" y2="700" stroke="#6b7280" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 5"></line><rect x="20" y="20" width="200" height="64" rx="10" fill="#fff" stroke="#6b7280" stroke-width="1.5" filter="url(#shadow)"></rect><text x="120" y="50" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2937">Agent harness</text><text x="120" y="70" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">Claude Code · pi</text><line x1="380" y1="84" x2="380" y2="700" stroke="#6b7280" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 5"></line><rect x="280" y="20" width="200" height="64" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"></rect><text x="380" y="50" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2937">agent host</text><text x="380" y="70" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">HostGlassTools</text><line x1="640" y1="84" x2="640" y2="700" stroke="#6b7280" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 5"></line><rect x="540" y="20" width="200" height="64" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"></rect><text x="640" y="50" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2937">Backend</text><text x="640" y="70" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">GlassToolRelay</text><line x1="880" y1="84" x2="880" y2="700" stroke="#6b7280" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 5"></line><rect x="780" y="20" width="200" height="64" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"></rect><text x="880" y="50" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2937">Glass tools</text><text x="880" y="70" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">McpServer</text><line x1="20" y1="126" x2="980" y2="126" stroke="#6b7280" stroke-opacity="0.2"></line><text x="24" y="118" text-anchor="start" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#6b7280">WHEN GLASS CONNECTS TO A HOST</text><line x1="636" y1="150" x2="384" y2="150" stroke="#374151" stroke-width="1.5" marker-end="url(#head)"></line><text x="510" y="142" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">OfferGlassTools(tools)</text><line x1="636" y1="190" x2="384" y2="190" stroke="#374151" stroke-width="1.5" marker-end="url(#head)"></line><text x="510" y="182" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">WatchToolCalls (stays open)</text><line x1="20" y1="244" x2="980" y2="244" stroke="#6b7280" stroke-opacity="0.2"></line><text x="24" y="236" text-anchor="start" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#6b7280">WHEN A WORK THREAD STARTS</text><line x1="636" y1="268" x2="384" y2="268" stroke="#374151" stroke-width="1.5" marker-end="url(#head)"></line><text x="510" y="260" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">StartThread(role: Work)</text><rect x="264.1" y="291" width="231.7" height="26" rx="6" fill="#fff6e0" stroke="#d97706" stroke-opacity="0.6"></rect><text x="380" y="309" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">issues a bearer for this Thread</text><line x1="376" y1="346" x2="124" y2="346" stroke="#374151" stroke-width="1.5" marker-end="url(#head)"></line><text x="250" y="338" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">start with /mcp URL + bearer</text><line x1="20" y1="400" x2="980" y2="400" stroke="#6b7280" stroke-opacity="0.2"></line><text x="24" y="392" text-anchor="start" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#6b7280">EACH CALL</text><line x1="124" y1="424" x2="376" y2="424" stroke="#374151" stroke-width="1.5" marker-end="url(#head)"></line><text x="250" y="416" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">tools/call with the bearer</text><rect x="277.6" y="447" width="204.9" height="26" rx="6" fill="#fff6e0" stroke="#d97706" stroke-opacity="0.6"></rect><text x="380" y="465" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">bearer → Thread; new callId</text><line x1="384" y1="502" x2="636" y2="502" stroke="#374151" stroke-width="1.5" marker-end="url(#head)"></line><text x="510" y="494" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">the call, on WatchToolCalls</text><rect x="514.1" y="525" width="251.8" height="26" rx="6" fill="#fff6e0" stroke="#d97706" stroke-opacity="0.6"></rect><text x="640" y="543" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">may this host call as that Thread?</text><line x1="644" y1="580" x2="876" y2="580" stroke="#374151" stroke-width="1.5" marker-end="url(#head)"></line><text x="760" y="572" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">callTool as ThreadCaller</text><line x1="876" y1="620" x2="644" y2="620" stroke="#374151" stroke-width="1.5" marker-end="url(#head)" stroke-dasharray="5 4"></line><text x="760" y="612" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">result</text><line x1="636" y1="660" x2="384" y2="660" stroke="#374151" stroke-width="1.5" marker-end="url(#head)"></line><text x="510" y="652" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">AnswerToolCall(callId, result)</text><line x1="376" y1="700" x2="124" y2="700" stroke="#374151" stroke-width="1.5" marker-end="url(#head)" stroke-dasharray="5 4"></line><text x="250" y="692" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">result</text><text x="500" y="740" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="13" fill="#6b7280">A refused caller gets an error result and the tool never runs. When the agent stops, its bearer stops working.</text><text x="500" y="764" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="13" fill="#6b7280">If the connection drops mid-call, each waiting call answers that it may or may not have happened.</text></svg>
