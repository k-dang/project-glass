<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690"><rect width="1000" height="690" fill="#ffffff"></rect><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"></path></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"></feDropShadow></filter></defs><rect x="20" y="20" width="960" height="220" rx="16" fill="#e8f1ff" stroke="#3b82f6" stroke-opacity="0.35" stroke-dasharray="6 5"></rect><text x="36" y="46" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#3b82f6">BACKEND · UTILITYPROCESS</text><rect x="20" y="290" width="300" height="330" rx="16" fill="#f3f4f6" stroke="#6b7280" stroke-opacity="0.35" stroke-dasharray="6 5"></rect><text x="36" y="610" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6b7280">DIRECT TO THE BACKEND</text><rect x="340" y="290" width="300" height="330" rx="16" fill="#e9f8ee" stroke="#16a34a" stroke-opacity="0.35" stroke-dasharray="6 5"></rect><text x="356" y="610" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#16a34a">LOCAL WORK THREAD</text><rect x="660" y="290" width="320" height="330" rx="16" fill="#fff6e0" stroke="#d97706" stroke-opacity="0.35" stroke-dasharray="6 5"></rect><text x="676" y="610" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#d97706">SANDBOX WORK THREAD</text><rect x="40" y="70" width="260" height="130" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"></rect><text x="170" y="100" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2937">MCP endpoint</text><text x="170" y="124" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">http://127.0.0.1:&lt;port&gt;/mcp</text><text x="170" y="143" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">Global chat credential, or</text><text x="170" y="162" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">an outside agent's OAuth token</text><rect x="370" y="70" width="260" height="130" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"></rect><text x="500" y="100" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2937">Glass tools</text><text x="500" y="124" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">one McpServer: mcp/glassTools.ts</text><text x="500" y="143" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">each call runs as its caller</text><rect x="700" y="70" width="260" height="130" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"></rect><text x="830" y="100" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2937">GlassToolRelay</text><text x="830" y="124" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">checks which Thread is calling</text><text x="830" y="143" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">Sandbox: only its own Thread</text><text x="830" y="162" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">this device: a local Work Thread</text><line x1="300" y1="135" x2="370" y2="135" stroke="#374151" stroke-width="1.5" marker-end="url(#head)"></line><rect x="298.3" y="99" width="73.4" height="19" rx="9" fill="#111827"></rect><text x="335" y="113" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="11.5" fill="#fff">as caller</text><line x1="700" y1="135" x2="630" y2="135" stroke="#374151" stroke-width="1.5" marker-end="url(#head)"></line><rect x="628.3" y="99" width="73.4" height="19" rx="9" fill="#111827"></rect><text x="665" y="113" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="11.5" fill="#fff">as Thread</text><rect x="90" y="330" width="210" height="90" rx="10" fill="#fff" stroke="#6b7280" stroke-width="1.5" filter="url(#shadow)"></rect><text x="195" y="360" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2937">Outside agent</text><text x="195" y="384" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">Claude Code in a terminal</text><rect x="40" y="470" width="260" height="90" rx="10" fill="#fff" stroke="#6b7280" stroke-width="1.5" filter="url(#shadow)"></rect><text x="170" y="500" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2937">Global chat</text><text x="170" y="524" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">pi in the local agent host</text><line x1="195" y1="330" x2="195" y2="200" stroke="#374151" stroke-width="1.5" marker-end="url(#head)"></line><rect x="174.8" y="254" width="40.4" height="19" rx="9" fill="#111827"></rect><text x="195" y="268" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="11.5" fill="#fff">HTTP</text><line x1="60" y1="470" x2="60" y2="200" stroke="#374151" stroke-width="1.5" marker-end="url(#head)"></line><rect x="39.8" y="254" width="40.4" height="19" rx="9" fill="#111827"></rect><text x="60" y="268" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="11.5" fill="#fff">HTTP</text><rect x="360" y="330" width="260" height="100" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"></rect><text x="490" y="360" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2937">agent host</text><text x="490" y="384" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">loopback /mcp, per-Thread bearer</text><text x="490" y="403" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">queues each call for the backend</text><rect x="360" y="490" width="260" height="80" rx="10" fill="#fff" stroke="#6b7280" stroke-width="1.5" filter="url(#shadow)"></rect><text x="490" y="520" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2937">Claude Code · pi</text><text x="490" y="544" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">Claude: MCP server · pi: extension</text><line x1="490" y1="490" x2="490" y2="430" stroke="#374151" stroke-width="1.5" marker-end="url(#head)"></line><rect x="420.3" y="452" width="139.4" height="19" rx="9" fill="#111827"></rect><text x="490" y="466" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="11.5" fill="#fff">tools/call + bearer</text><line x1="490" y1="330" x2="780" y2="200" stroke="#374151" stroke-width="1.5" marker-end="url(#head)" marker-start="url(#head)"></line><rect x="550.1" y="254" width="99.8" height="19" rx="9" fill="#111827"></rect><text x="600" y="268" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="11.5" fill="#fff">WebSocket RPC</text><rect x="690" y="330" width="270" height="100" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"></rect><text x="825" y="360" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2937">agent host bundle</text><text x="825" y="384" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">the same /mcp, inside the Sandbox</text><text x="825" y="403" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">Glass reaches it through target()</text><rect x="690" y="490" width="270" height="80" rx="10" fill="#fff" stroke="#6b7280" stroke-width="1.5" filter="url(#shadow)"></rect><text x="825" y="520" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2937">Claude Code · pi</text><text x="825" y="544" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="12.5" fill="#1f2937" opacity="0.75">on the Thread's branch</text><line x1="825" y1="490" x2="825" y2="430" stroke="#374151" stroke-width="1.5" marker-end="url(#head)"></line><rect x="755.3" y="452" width="139.4" height="19" rx="9" fill="#111827"></rect><text x="825" y="466" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="11.5" fill="#fff">tools/call + bearer</text><line x1="825" y1="330" x2="860" y2="200" stroke="#374151" stroke-width="1.5" marker-end="url(#head)" marker-start="url(#head)"></line><rect x="803.7" y="254" width="152.6" height="19" rx="9" fill="#111827"></rect><text x="880" y="268" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="11.5" fill="#fff">WebSocket RPC + token</text><text x="500" y="660" text-anchor="middle" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="13" fill="#6b7280">Review Threads get no Glass tools. A call runs at most once: one that loses its connection says it may or may not have happened.</text></svg>
